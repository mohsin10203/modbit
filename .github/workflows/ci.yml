# Modbit CI.
#
# `.agents.md` §8 states that CI uses the stable repository commands, and `Makefile` comments have
# been claiming "CI runs it" for the slower gates. Neither was true: no workflow existed. This makes
# the statement accurate rather than aspirational — a gate nobody runs is documentation, and the
# whole point of `perf-gate`, `cross-check` and `capability-check` is that they fail somewhere other
# than on the author's machine.
#
# Every target invoked here has been run locally and passes. Nothing aspirational is wired in.
#
# # Why per-push jobs are Linux-only
#
# This is a private repository, so Actions minutes are metered, and **macOS runners bill at 10x the
# Linux rate**. Three macOS jobs on every push consumed roughly 200 charged minutes per run against a
# 2,000-minute monthly allowance — about ten pushes before CI stops working, which is how the
# previous account ended up with every job refused.
#
# So the fast path is Linux and macOS moved to `macos-gates`, which runs nightly and on demand. That
# is a real reduction in coverage and it is worth naming rather than burying: FSEvents (ADR-0104) and
# the Seatbelt backend (ADR-0101) are macOS-only code, and between pushes they are now covered by the
# nightly run rather than by the gate that blocks a merge. `cross-check` still compiles every target
# on every push, so a macOS *build* break is caught immediately; a macOS *behaviour* break is caught
# within a day.
#
# The two defects this workflow has actually found -- a missing build constraint on shim.c and a
# sandbox cancellation that killed one PID instead of the process group -- were both found by the
# Linux leg, which is the one that stays.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # perf-gate is wall-clock and needs a quiet machine, so it runs on a schedule rather than on
  # every push, where a busy runner would make it flap. See `pkg/index/perf_test.go`.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # The pre-review gate: format, lint, typecheck, generated-code drift, unit tests, and the three
  # contract gates. This is what `make check` runs, and it is the job that must stay fast.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check

  # Build every supported target with cgo disabled. Cheap, and it catches the class of break that is
  # otherwise invisible until a release: a build-tagged file that only compiles on the author's
  # platform. It found `modberr.CodeUnimplemented` — a code that does not exist — on its first run.
  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make cross-check

  # Adversarial and contract suites (R-TST-05, R-TST-06). Separated from `check` so a failure names
  # which kind of guarantee broke rather than reporting "tests failed".
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-security
      - run: make test-conformance
      - run: make test-integration
      - run: make test-e2e

  # Everything macOS, on a nightly schedule and on demand rather than per push.
  #
  # This is the only place FSEvents (ADR-0104) and the Seatbelt backend (ADR-0101) run at all, and it
  # is the only place the change-source parity claim gets its second platform:
  # `TestSecurityAnUnwatchableRootIsRefusedOnEveryPlatform` asserts the backends refuse identical
  # inputs, and a parity claim verified on one platform is not verified.
  #
  # A failure here does not block a merge, which is the cost of metering. It does produce a named
  # failing run within 24 hours, which is strictly better than the alternative that was actually in
  # place until yesterday: no CI at all.
  macos-gates:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make test-security
      - run: make test-conformance

  # PRD §8A.3 performance budgets. Scheduled rather than per-push: these are wall-clock p95 budgets,
  # and a shared runner under load reports numbers that say more about the runner than the code — an
  # early local run reported LCX-4 at 286 ms where the idle figure was 21 ms.
  #
  # It is therefore advisory here. A regression shows up as a failed scheduled run to investigate,
  # not as a blocked pull request, until it runs on hardware that makes the numbers trustworthy.
  perf-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make perf-gate
