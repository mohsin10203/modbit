# Capability: index ignore and classification filter.
#
# CTX-4 requires ignored and restricted content to be excluded *before* indexing, which makes this
# filter the gate every other context capability sits behind. It is also where SDD §8 places
# provenance assignment (TNT-1), so a context item cannot exist without a taint class.

id: context.classification
version: 1
owner: knowledge
security_class: critical

requirements:
  - PRD-v5.1-§9.3-CTX-3
  - PRD-v5.1-§9.3-CTX-4
  - PRD-v5.1-§9.3-CTX-5
  - PRD-v5.1-§9.3-CTX-7
  - PRD-v5.1-§9.3-CTX-12
  - PRD-v5.1-§9.4-RET-6
  - PRD-v5.1-§9.4-RET-8
  - PRD-v5.1-§9.4-RET-9
  - PRD-v5.1-§20A.10-context-and-indexing
  - SDD-v5.1-§8-classification-filter
  - PRD-v5.1-§12A-TNT-1

surfaces:
  desktop: required
  cli: required
  ts_sdk: required
  python_sdk: required
  web: equivalent
  extension: equivalent

events:
  - context.index.started
  - context.index.completed
  - context.index.failed

settings:
  - context.indexing.enabled
  - context.indexing.respect_gitignore
  - context.indexing.excluded_globs
  - context.indexing.max_file_bytes

tests:
  - pkg/index:TestGitignoreSemantics
  - pkg/index:TestNegationCannotReachInsideAnExcludedDirectory
  - pkg/index:TestSecurityProtectedPathsAreNeverIndexed
  - pkg/index:TestProtectedPathsOutrankEveryOtherRule
  - pkg/index:TestRepositoryContentIsClassifiedUntrusted
  - pkg/index:TestGitignoreIsHonouredOnlyWhenPolicyAllows
  - pkg/index:TestWalkDiscoversIgnoreFilesHierarchically
  - pkg/index:TestWalkPrunesExcludedDirectoriesInsteadOfDescending
  - pkg/index:TestWalkFailsClosedOnAnUnreadableIgnoreFile
  - pkg/index:TestSecurityWalkNeverFollowsSymlinks
  - pkg/index:TestSecurityModbitIgnoredFilesAreNeverOpened
  - pkg/index:TestSecurityWalkPrunesVersionControlMetadata
  - pkg/index:TestSecurityWalkDoesNotOpenIrregularFiles
  - pkg/index:TestIndexingIgnoreYieldsReferenceNotExclusion
  - pkg/index:TestGlobFormsAgreeWithGlobSemantics
  - pkg/index:TestSecurityAddingAnIgnoreRuleRetractsIndexedContent
  - pkg/index:TestPathsOutsideTheScannedScopeAreNotTreatedAsDeleted
  - pkg/index:TestRescanRecoversFromDroppedNotifications
  - pkg/index:TestFlushPolicyCapsTheDebounceSoEditsCannotStarveTheIndex
  - pkg/index:TestSecurityBranchSwitchRefusesAnIncrementalFlush
  - pkg/index:TestSecurityMalformedRefNamesAreRejected
  - pkg/index:TestSecurityKeyCannotBeSteeredByABranchName
  - pkg/index:TestSecurityLinkedWorktreeGitFileIsNotIndexed
  - pkg/index:TestLinkedWorktreeHasItsOwnHeadButSharedRefs
  - pkg/index:TestRevisionKeyPartitionsByWorktreeAndBranch
  # Citations and context-item provenance (CTX-A01i). Cite is the boundary between what was indexed
  # and what a model may see, so its refusals are part of this capability's contract, not a detail.
  - pkg/index:TestSecurityAnExcludedPathCanNeverBeCited
  - pkg/index:TestSecurityProtectedContentCannotBeCitedFromARealTree
  - pkg/index:TestSecurityRefusalDoesNotDistinguishExcludedFromAbsent
  - pkg/index:TestSecurityProvenanceIsDerivedNotSupplied
  - pkg/index:TestSecurityACitationCarriesNoContentBody
  - pkg/index:TestSecurityAPackCannotMixRevisions
  - pkg/index:TestEveryRET6FieldIsRequired
  - pkg/index:TestReferenceItemsCiteWholeFilesWithNoContent
  - pkg/index:TestWholeFileInclusionMustRecordItsReason
  - pkg/index:TestASpanMustLieInsideTheIndexedFile
  - pkg/index:TestContentDigestCoversExactlyTheCitedBytes
  - pkg/index:TestPackTaintIsPropagatedNotInherited
  - pkg/index:TestEveryItemNamesItsSnapshotAndRevision
  # Watcher loop driving the reindexer from a change source (CTX-A01c2).
  - pkg/index:TestWatcherRescansBeforeApplyingAnyDelta
  - pkg/index:TestWatcherFlushesPendingChangesByTheDeadline
  - pkg/index:TestWatcherResolvesALostBatchToAFullRescan
  - pkg/index:TestWatcherCoalescesRepeatedLosses
  - pkg/index:TestWatcherReadsTheSourceWhileScanning
  - pkg/index:TestWatcherFlushesWhatItHasWhenTheSourceStops
  - pkg/index:TestWatcherStopsOnCancellationAndClosesTheSourceOnce
  - pkg/index:TestWatcherSurfacesAnApplyFailureInsteadOfContinuing
  - pkg/index:TestPollSourceDrivesAWatcherEndToEnd
  # The shared ChangeSource suite every platform backend must pass (CTX-A01c3–c5), and the check
  # that it can actually fail.
  - pkg/index:TestPollSourceIsConformant
  - pkg/index:TestSecurityChangeSourceConformanceDetectsALeakedReader
  # Native macOS backend (CTX-A01c3, ADR-0104). The first source to exercise D7 — the delta path
  # was Skipped everywhere while PollSource, which only rescans, was the sole implementation.
  - pkg/index/fsevents:TestFSEventsSourceIsConformant
  - pkg/index/fsevents:TestAWriteIsReportedRelativeToTheWatchedRoot
  - pkg/index/fsevents:TestADeletedFileIsReportedAsRemoved
  - pkg/index/fsevents:TestSecurityAnUnwatchableRootIsRefused
  # The overflow path the suite leaves Skipped for this source: loss must be reported as a rescan,
  # never dropped, or the index is left confidently wrong.
  - pkg/index/fsevents:TestABurstThatOutrunsTheSourceBecomesARescan
  # The composed pipeline: write -> walk -> classify -> reindex -> index -> search -> cite.
  # Every stage above has its own tests; these assert the promise the stages exist to deliver.
  - pkg/index:TestAFileOnDiskBecomesACitation
  - pkg/index:TestSecurityADeletedFileLeavesBothTheIndexAndTheManifest
  - pkg/index:TestSecurityExcludedContentNeverReachesARetrievalResult
  - pkg/index:TestAnEditBecomesSearchableThroughARunningWatcher
  - pkg/index:TestSecurityEveryLexicalResultIsCitable
  # Lexical channel (CTX-A01d).
  - pkg/index:TestSecurityLexicalResultsNeverCrossRevisions
  - pkg/index:TestSecurityOnlyIndexableContentCanBeChunked
  - pkg/index:TestRemovedPathsDisappearFromResults
  - pkg/index:TestReindexingAPathReplacesItsDocuments
  - pkg/index:TestRankingIsDeterministicAcrossRuns
  - pkg/index:TestIdentifiersMatchTheirParts
  - pkg/index:TestMatchesCarryASpanACitationCanUse
  - pkg/index:TestSkippingWorkNeverChangesTheAnswer
  - pkg/index:TestApplyChangeSetIndexesUpsertsAndDropsRemovals
  - pkg/index:TestApplyChangeSetRetractsAFileThatBecameEmpty
  - pkg/index:TestChunksTileTheFileWithExactSpans
  # Semantic channel (CTX-A01f). The network-boundary guard is part of this capability's contract:
  # embedding is egress of repository content and must route through the Model Gateway.
  - pkg/index:TestSecurityIndexPackageCannotReachTheNetwork
  - pkg/index:TestSecurityVectorResultsNeverCrossRevisions
  - pkg/index:TestSecurityVectorsFromDifferentModelsAreNeverCompared
  - pkg/index:TestSecurityExcludedContentIsNeverEmbedded
  - pkg/index:TestSecurityVectorIndexRetainsNoText
  - pkg/index:TestVectorRemovalDropsEveryVectorForAPath
  - pkg/index:TestReindexingAPathReplacesItsVectors
  - pkg/index:TestVectorRankingIsIndependentOfInsertionOrder
  - pkg/index:TestVectorMatchesCarryASpanACitationCanUse
  - pkg/index:TestMalformedVectorsAreRefusedNotCoerced
  - pkg/index:TestABatchWithOneBadVectorIsRefusedWhole
  - pkg/index:TestEmbedChangeSetIndexesUpsertsAndDropsRemovals
  - pkg/index:TestEmbeddingFailureSurfacesAsAVisibleDegradation
  - pkg/index:TestAVectorCountMismatchIsRefused
  # Symbol and graph channels (CTX-A01e). CTX-12 lives in the dependency guard above: go/build and
  # go/importer are refused there, so a parse cannot become an execution.
  - pkg/index:TestGoExtractorFindsEveryDeclarationKind
  - pkg/index:TestSymbolSpansCoverTheDocCommentAndAreExact
  - pkg/index:TestImportEdgesAreExtractedWithTheirSpans
  - pkg/index:TestSecurityExcludedContentIsNeverParsed
  - pkg/index:TestSecuritySymbolLookupsNeverCrossRevisions
  - pkg/index:TestUnparseableFilesDegradeVisibly
  - pkg/index:TestRemovedPathsDisappearFromTheSymbolIndex
  - pkg/index:TestReindexingAPathReplacesItsSymbols
  - pkg/index:TestQualifiedLookupsDistinguishSameNamedMethods
  - pkg/index:TestSymbolResultsAreIndependentOfIndexingOrder
  - pkg/index:TestExtractChangeSetIndexesUpsertsAndDropsRemovals
  - pkg/index:TestExtractChangeSetSurvivesAnUnparseableFile
  # Snapshot integrity and manifest hygiene (CTX-A01h).
  - pkg/index:TestSecurityExcludedPathsCannotEnterAManifest
  - pkg/index:TestSecurityModbitStateDirectoryIsExcludedByDefault
  - pkg/index:TestSecurityRepositoryMetadataIsNotIndexed
  - pkg/index:TestSecuritySnapshotCorruptionIsDetected
  # Outstanding for the rest of CTX-A01: native change sources per platform (CTX-A01c3-c5), a native
  # lexical engine (CTX-A01d2), pgvector behind the vector port (CTX-A01f2), and a tree-sitter
  # extractor for the remaining languages (CTX-A01e2).
  - conformance/context-classification
