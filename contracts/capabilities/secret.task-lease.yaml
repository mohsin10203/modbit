# Capability: task secret leases.
#
# SEC-13 binds an injected secret lease to "one run, step, tool, executable identity, worker, and
# environment". Six coordinates, and the reason to compare all of them is that a token which works
# anywhere is a token whose theft is undetectable -- it produces valid use from the wrong place, and
# nothing in the record distinguishes that from correct use. Five coordinates agreeing means the
# sixth was substituted, which is the case worth catching rather than rounding off.
#
# SEC-14's list -- trace, prompt, logs, command display, shell history, process listings, artifacts
# -- is a list of places a string ends up when somebody formats a struct. So the defence cannot be a
# rule about formatting; it has to be that formatting cannot reach the value.

id: secret.task-lease
version: 1
owner: security
security_class: critical

requirements:
  - PRD-v5.1-§17.3-SEC-10
  - PRD-v5.1-§17.3-SEC-11
  - PRD-v5.1-§17.3-SEC-12
  - PRD-v5.1-§17.3-SEC-13
  - PRD-v5.1-§17.3-SEC-14
  - PRD-v5.1-§17.3-SEC-16
  - PRD-v5.1-§17.3-SEC-17

surfaces:
  desktop: required
  cli: required
  ts_sdk: required
  python_sdk: required
  web: admin_only
  extension: not_applicable

events: []

settings: []

tests:
  # SEC-14. Every rendering path, including the audit line that exists so callers do not format the
  # struct themselves.
  - pkg/secret:TestSecurityTheValueIsUnreachableThroughEveryRenderingPath
  # SEC-13's binding, and the silence of its refusal: naming the differing coordinate would let a
  # holder of a stolen value discover the binding by probing one field at a time.
  - pkg/secret:TestSecurityEveryBindingCoordinateIsChecked
  - pkg/secret:TestSecurityAnIncompleteBindingIsRefused
  # SEC-10 and SEC-13. The use count and expiry are enforced rather than recorded, and a lease with
  # no expiry is refused at mint -- that is the one that outlives the run, the worker, and the
  # incident that justified it.
  - pkg/secret:TestSecurityTheUseCountIsEnforced
  - pkg/secret:TestSecurityExpiryIsEnforcedAndRequired
  # SEC-16. Revocation arrives from several directions at once, so it is idempotent -- a second call
  # failing would turn a safe duplicate into an error somebody suppresses.
  - pkg/secret:TestSecurityRevocationIsImmediateAndIdempotent
  # SEC-13. A secret surviving into a child survives into whatever that child spawns, at which point
  # the boundary stops being describable, so inheritance is denied unless asked for.
  - pkg/secret:TestSecurityChildInheritanceIsDeniedByDefault
  # SEC-11, SEC-12, SEC-17. Brokered use is preferred, so the answer is "may inject" and never
  # "must"; every unmet clause is named so a tool author can implement it rather than just be denied.
  - pkg/secret:TestTheInjectionContractNamesEveryUnmetClause
