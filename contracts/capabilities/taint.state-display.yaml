# Capability: taint state display and inspector.
#
# Source row: capability-matrix-v5.1.md "Taint state display and inspector (TNT)" — R on every
# surface including extensions, because a user must be able to see the provenance state that is
# changing their approval prompts wherever they are working.

id: taint.state_display
version: 1
owner: product-security
security_class: high

requirements:
  - PRD-v5.1-§12A-TNT-1
  - PRD-v5.1-§12A-TNT-2
  - PRD-v5.1-§12A-TNT-5
  - PRD-v5.1-§12A-TNT-6

surfaces:
  desktop: required
  cli: required
  ts_sdk: required
  python_sdk: required
  web: required
  extension: required

events:
  - taint.class.entered
  - taint.escalation.applied

settings:
  - taint.enforcement.enabled
  - taint.unknown_provenance.class

tests:
  # TNT-6 fail-closed, and the lattice it rests on. Unknown provenance resolving to the highest-risk
  # class is the invariant; these are the cases that prove it holds through parsing, text round
  # trips and derivation rather than only at the top-level entry point.
  - pkg/taint:TestSetTextRoundTripAndUnknownFailsClosed
  - pkg/taint:TestParseClassAcceptsBothPRDAndContractSpellings
  - pkg/taint:TestKnownSecretIsTheHighestRiskClass
  - pkg/taint:TestUnknownProvenanceIsNotClassifiedAsASecret
  - pkg/taint:TestDeriveFromTrustedInputIsGenerated
  - pkg/taint:TestSetOperations
  - pkg/taint:TestPropagateInheritsTheHighestRiskContributor
  - pkg/taint:TestUnknownProvenanceFailsClosed
  - pkg/taint:TestDeriveInheritsTaintThroughSummarization
  - conformance/taint-state-display
