# Capability: CodeWiki citation validation.
#
# WIKI-3 requires every technical statement to link to source spans, artifacts, "or explicitly
# labeled inferences". The third option is what makes the rule survivable: a generator that could
# never say anything uncited would either omit every synthesis or fabricate a citation for it, and
# the second failure is the one nobody catches.
#
# So this is the same shape as the degradation reason in runtime.degradation and the inconclusive
# verdict in verification.adequacy -- the unsupported case is permitted and must be declared.

id: codewiki.evidence
version: 1
owner: knowledge
security_class: high

requirements:
  - PRD-v5.1-§9A-WIKI-2
  - PRD-v5.1-§9A-WIKI-3
  - PRD-v5.1-§9A-WIKI-4

surfaces:
  desktop: required
  cli: required
  ts_sdk: required
  python_sdk: required
  web: equivalent
  extension: equivalent

events: []

settings: []

tests:
  # WIKI-3: cited, or labelled and explained. Nothing else publishes.
  - pkg/codewiki:TestSecurityAnUncitedTechnicalStatementIsRefused
  - pkg/codewiki:TestAnInferenceIsPermittedOnlyWhenExplained
  # The classifier's default branch is what enforces WIKI-3, not the zero value. A kind from a newer
  # generator or a typo is held to the technical rule rather than treated as prose -- found because a
  # mutation making KindTechnical non-zero survived, which showed the zero-value test did not reach
  # the property it was named for.
  - pkg/codewiki:TestTheZeroKindIsTechnical
  - pkg/codewiki:TestSecurityAnUnrecognisedKindIsHeldToTheTechnicalRule
  # WIKI-2 binds a page to one revision and one Context Snapshot. A citation from another is the
  # failure that matters: the span is real, the file exists, the digest verifies, and it documents
  # code the page is not about.
  - pkg/codewiki:TestSecurityACitationFromAnotherRevisionIsRefused
  - pkg/codewiki:TestSecurityACitationFromAnotherSnapshotIsRefused
  - pkg/codewiki:TestSecurityAPageWithNoSnapshotCannotBeValidated
  # WIKI-4: diagrams get no inference escape hatch, because a node drawn from nothing is a guess.
  - pkg/codewiki:TestSecurityADiagramNodeNeedsEvidence
  # A report names what failed so a generator regenerates the statement rather than the page, and
  # splits cited from inferred -- an all-inference page is valid under WIKI-3 and worth noticing.
  - pkg/codewiki:TestEveryFindingNamesWhatFailed
  - pkg/codewiki:TestTheReportDistinguishesCitedFromInferred
  - pkg/codewiki:TestADuplicateStatementIdentifierIsRefused
  # WIKI-1. Policy first and absolutely: a user setting that could re-enable what policy disabled
  # would make the policy a suggestion, and that is the direction INV-9 forbids. With both off,
  # policy is the reported reason -- the only case where the check order is observable, and the one
  # that matters, because telling a user their setting disabled it sends them to flip a switch that
  # changes nothing.
  - pkg/codewiki:TestSecurityAUserSettingCannotReEnableGenerationPolicyDisabled
  # WIKI-10's "but remains provider-policy compliant" is the requirement. A dedicated documentation
  # model arrives as a special case in the config and the natural place to wire it is around
  # whatever picks models for runs -- which is where the policy check lives. Then a deployment that
  # forbids a provider finds its repositories documented by it.
  - pkg/codewiki:TestSecurityTheDocumentationModelIsNotExemptFromProviderPolicy
  # WIKI-6. "Fresh" as a zero value means a page goes stale silently the first time nobody runs the
  # calculation, and a page that cannot say what it was derived from cannot be shown unaffected.
  - pkg/codewiki:TestSecurityTheZeroFreshnessIsNotFresh
  - pkg/codewiki:TestSecurityFreshnessMovesOnASymbolOrAnEdge
  # WIKI-5. The refresh set is derived from freshness rather than computed again, because two
  # implementations of "which pages are affected" is how a page stays marked stale forever.
  - pkg/codewiki:TestSecurityTheRefreshSetAgreesWithFreshness
  # WIKI-7. An effort a user cannot price is one they cannot agree to.
  - pkg/codewiki:TestSecurityAnEffortWithoutACostOrDurationCannotBeOffered
  # WIKI-8 and WIKI-9. A run that discards four hours of finished pages because stage six failed
  # will be retried from scratch or not at all, and neither is what anybody wanted. Cancellation and
  # failure both keep their pages and stay distinguishable: one is a user changing their mind.
  - pkg/codewiki:TestSecurityAStoppedGenerationKeepsItsCompletedPages
  # WIKI-22 and the PRD's rejected proposal element 7: a wiki generated from a private repository
  # cannot be published publicly. The case is easy to reach because the wiki *feels* like a separate
  # artifact -- prose somebody generated rather than the code -- and it is a description of the
  # private code detailed enough to be worth writing down, which is what makes publishing it look
  # harmless and be the opposite. The repository's visibility is a caller-supplied fact, not a field
  # of the share request, for the same reason WRK-3's organization is a parameter.
  - pkg/codewiki:TestSecurityAPrivateRepositorysWikiCannotBePublished
  - pkg/codewiki:TestSecurityPublishingIsOffByDefaultAndTheZeroVisibilityIsPrivate
  # WIKI-14. The cheap way to satisfy it is a flag on each statement, and that works until something
  # appends to the wrong list -- then WIKI-3's citation rule either rejects human prose or accepts
  # uncited generated claims, and the second is the one that ships. Annotations live in their own
  # field and the citation validator never sees them.
  - pkg/codewiki:TestSecurityAnAnnotationIsAttributedAndOutsideTheCitationRules
  # WIKI-12. "Where configured" is per path: a configuration naming one page must not switch cluster
  # planning off for the whole repository.
  - pkg/codewiki:TestSecurityAnExplicitPageOverridesOnlyItsOwnPath
  # WIKI-15. Every problem with its line, in line order -- a configuration with four mistakes should
  # take one round trip to fix, not four. Includes the hierarchy cycle a per-entry check misses.
  - pkg/codewiki:TestSecurityEveryConfigurationProblemIsReportedWithItsLine
  # WIKI-13. Annotations are the one part of a wiki that cannot be regenerated, so a rename carries
  # them -- along with the configuration and both sides of the hierarchy.
  - pkg/codewiki:TestSecurityARenameCarriesAnnotationsAndConfiguration
  # WIKI-11. One Config and one validator: two structs kept in sync by intention drift apart the
  # first time somebody adds a field to the form.
  - pkg/codewiki:TestOneConfigurationSchemaServesBothSurfaces
