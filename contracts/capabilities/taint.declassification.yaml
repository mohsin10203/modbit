# Capability: taint declassification.
#
# Source row: capability-matrix-v5.1.md "Taint declassification" — R on desktop, CLI, and SDK;
# administrator-only on web; not applicable in extensions. Declassification is a privileged act
# that must record an accountable actor and rationale (TNT-2), so it is never an extension gesture.

id: taint.declassification
version: 1
owner: product-security
security_class: critical

requirements:
  - PRD-v5.1-§12A-TNT-2
  - PRD-v5.1-§12A-TNT-5

surfaces:
  desktop: required
  cli: required
  ts_sdk: required
  python_sdk: required
  web: admin_only
  extension: not_applicable

events:
  - taint.declassified

settings:
  - taint.declassification.allowed
  - taint.declassification.min_role

tests:
  # The ledger itself (TNT-2). These were passing and unregistered: the propagation record is the
  # thing an auditor reads, and its copy semantics and immutability are what make it a record rather
  # than a mutable view.
  - pkg/taint:TestLedgerRecordsEntriesAndMaintainsTheSet
  - pkg/taint:TestNewLedgerRequiresARunIdentifier
  - pkg/taint:TestEntriesAndDeclassificationsAreCopies
  - pkg/taint:TestFirstEntryTimeIsNotAdvancedByLaterEntries
  # INV-11 at the declassification boundary: a known secret is not declassifiable by writing a
  # rationale, and redaction needs verified evidence rather than an assertion that it happened.
  - pkg/taint:TestKnownSecretCannotBeDeclassifiedByRationale
  - pkg/taint:TestRedactSecretRequiresVerifiedEvidence
  - pkg/taint:TestDeclassifyRequiresAccountabilityAndLowersRisk
  - conformance/taint-declassification
  - pkg/policy:TestSecurityKnownSecretCannotReachAnExternalSink
  - pkg/policy:TestSecurityTaintBypassAttemptsAreRefused
  - security/taint-declassification-authorization
